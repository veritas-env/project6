# One application, fully self-contained. Run from the repository root:
#   docker compose -f deployment/compose.yaml --env-file .env up -d
#
# Only Nginx publishes a port, and only on 127.0.0.1: the VPS-level TLS gateway
# proxies to it. Backend, frontend, Postgres and Redis sit on internal networks
# with no route to the internet (no egress).

name: ${APP_SLUG:?set APP_SLUG in .env}

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  tmpfs: ["/tmp:size=32m"]

services:
  nginx:
    <<: *hardening
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    cap_add: [CHOWN, SETUID, SETGID]   # worker processes drop to the nginx user
    tmpfs: ["/tmp:size=32m", "/var/cache/nginx:size=32m", "/var/run:size=1m", "/etc/nginx/conf.d:size=1m"]
    ports: ["127.0.0.1:${APP_HTTP_PORT:?set APP_HTTP_PORT}:8080"]
    environment:
      GATEWAY_CIDR: ${GATEWAY_CIDR:-172.17.0.0/16}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    networks:
      edge: {}
      app: { ipv4_address: 172.28.10.10 }
    depends_on: [frontend, backend]
    mem_limit: 64m

  frontend:
    <<: *hardening
    image: ${FRONTEND_IMAGE:-app-frontend:dev}
    build: { context: .., dockerfile: deployment/Dockerfile.frontend, args: { NEXT_PUBLIC_APP_NAME: "${APP_NAME:-ProjectFlow}" } }
    networks: [app]
    mem_limit: 256m

  backend:
    <<: *hardening
    image: ${BACKEND_IMAGE:-app-backend:dev}
    build: { context: .., dockerfile: deployment/Dockerfile.backend }
    environment:
      APP_ENV: production
      APP_NAME: ${APP_NAME:-ProjectFlow}
      APP_DATABASE_URL: postgresql+psycopg://app_rw:${DB_RW_PASSWORD:?}@postgres:5432/app
      APP_REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      APP_SECRET_KEY: ${APP_SECRET_KEY:?}
      APP_UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]
    networks: [app, data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 384m

  migrate:
    image: ${BACKEND_IMAGE:-app-backend:dev}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-m", "app.cli", "migrate"]
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?}
      APP_DATABASE_URL: postgresql+psycopg://app_owner:${DB_OWNER_PASSWORD:?}@postgres:5432/app
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_RW_PASSWORD: ${DB_RW_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      retries: 20
    mem_limit: 256m

  redis:
    <<: *hardening
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no",
              "--rename-command", "CONFIG", "", "--rename-command", "FLUSHALL", "", "--rename-command", "DEBUG", ""]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    mem_limit: 64m

networks:
  edge: {}                               # Nginx <-> host only
  app:                                   # Nginx <-> frontend/backend; no internet
    internal: true
    ipam: { config: [{ subnet: 172.28.10.0/24 }] }
  data: { internal: true }               # backend <-> Postgres/Redis; no internet

volumes:
  pgdata: {}
  uploads: {}
