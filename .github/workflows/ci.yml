# CI: tests, security suites, dependency audits, image build, image scan, SBOM.
# Every action is pinned to a full commit SHA (A03); the tag is in the comment.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      APP_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@127.0.0.1:5432/app_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install (hash-checked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Tests, including the ten OWASP negative security suites
        run: python -m pytest -q
      - name: Dependency audit (fails on any known vulnerability)
        run: python -m pip_audit -r requirements.lock --require-hashes --disable-pip --strict

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --ignore-scripts
      - name: Dependency audit (fails on any known vulnerability)
        run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build image
        run: docker build -f deployment/Dockerfile.${{ matrix.part }} -t app-${{ matrix.part }}:${{ github.sha }} .
      - name: Scan image (fails on any fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-${{ matrix.part }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-${{ matrix.part }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.part }}.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.part }}
          path: sbom-${{ matrix.part }}.cdx.json
